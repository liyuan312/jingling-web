<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>精灵传说 · 网页版</title>
<style>
  :root{
    --q-norm:#cfcfcf; --q-rare:#4fe06a; --q-epic:#b560ff; --q-leg:#ffa51e; --q-myth:#ff3d3d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
  body{
    background:#04060f;
    display:flex;align-items:center;justify-content:center;
  }
  /* 游戏舞台 */
  #stage{
    position:relative;width:min(100vw, 100vh*4/3);height:min(100vh, 100vw*3/4);
    max-width:1000px;max-height:750px;border-radius:18px;overflow:hidden;
    box-shadow:0 18px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.14);
  }
  /* ── 动态星空背景 ── */
  #bgSky{position:absolute;inset:0;background:linear-gradient(180deg,#03040c 0%,#081026 45%,#10203f 100%);}
  #bgNebula{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(55% 42% at 18% 16%, rgba(96,64,190,.20), transparent 62%),
      radial-gradient(48% 40% at 84% 24%, rgba(44,120,210,.16), transparent 62%),
      radial-gradient(70% 46% at 52% 88%, rgba(20,90,140,.12), transparent 62%);}
  #spark{position:absolute;inset:0;pointer-events:none;z-index:2;}

  /* 顶部 HUD */
  #hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;gap:10px;align-items:center;
    background:linear-gradient(180deg, rgba(0,4,14,.6), transparent);z-index:5;}
  .hud-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);
    backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.26);border-radius:999px;
    padding:4px 11px;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5);font-size:14px;}
  .hud-pill .lbl{color:rgba(255,255,255,.75);font-weight:400;font-size:11px;}
  .hud-pill.cbtn{cursor:pointer;transition:.15s;}
  .hud-pill.cbtn:hover{transform:translateY(-1px);background:rgba(255,255,255,.22);}
  .ballIcon{width:20px;height:20px;image-rendering:pixelated;}
  #hudMaster{margin-left:auto;}
  #xpbar{flex:1;min-width:100px;height:14px;background:rgba(0,0,0,.4);border-radius:999px;overflow:hidden;
    border:1px solid rgba(255,255,255,.25);}
  #xpfill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#ffd94d,#ffb02e);
    box-shadow:0 0 10px #ffd94d;transition:width .4s;}
  #xptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5);}

  /* 主内容 */
  #view{position:absolute;top:56px;bottom:56px;left:0;right:0;padding:10px 14px;overflow:hidden;}
  .screen{display:none;width:100%;height:100%;}
  .screen.on{display:block;}

  /* 底部导航（第一个即孵化） */
  #tabs{position:absolute;bottom:0;left:0;right:0;display:flex;background:rgba(3,8,20,.88);
    backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.14);z-index:6;}
  .tab{flex:1;padding:9px 0 8px;text-align:center;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;
    cursor:pointer;border-top:3px solid transparent;transition:.2s;user-select:none;}
  .tab .ico{font-size:20px;display:block;margin-bottom:2px;}
  .tab.on{color:#fff;border-top-color:#ffd94d;background:rgba(255,217,77,.12);}

  /* Toast */
  #toast{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:rgba(10,20,45,.94);
    color:#fff;padding:8px 18px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:.3s;
    border:1px solid rgba(255,255,255,.3);box-shadow:0 6px 24px rgba(0,0,0,.5);pointer-events:none;}
  #toast.show{opacity:1;}

  /* 孵化页 */
  #treeView{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;}
  #scene{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
  /* 凤王精灵蛋（华丽版：金色流光 + 旋转光环 + 呼吸辉光） */
  #treeBtn{position:relative;width:200px;height:250px;cursor:pointer;user-select:none;
    filter:drop-shadow(0 0 34px rgba(255,150,60,.45));
    animation:eggFloat 2.8s ease-in-out infinite;transition:transform .12s;}
  #treeBtn:hover #eggBody{transform:scale(1.05);}
  #treeBtn:active #eggBody{transform:scale(.92);}
  #eggBody{position:absolute;inset:0;border-radius:50% 50% 46% 46%;
    background:radial-gradient(circle at 30% 20%, #fff6df 0%, #ffd88f 24%, #ff9a4a 50%, #e04a1e 76%, #8f180c 100%);
    border:3px solid rgba(255,195,90,.65);
    box-shadow:inset -18px -26px 44px rgba(80,10,0,.6), inset 10px 14px 30px rgba(255,235,200,.5);
    animation:eggGlow 2.2s ease-in-out infinite;transition:transform .12s;}
  #eggBody::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(115deg, transparent 32%, rgba(255,255,255,.7) 46%, rgba(255,255,255,.12) 52%, transparent 62%);
    background-size:240% 100%;background-position:130% 0;animation:sheen 3.4s linear infinite;}
  .eggspot{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(110,10,0,.55),rgba(110,10,0,.28) 70%,transparent);
    filter:blur(1px);}
  #treeBtn .eggspot:nth-child(3){width:30px;height:30px;left:20%;top:26%;}
  #treeBtn .eggspot:nth-child(4){width:22px;height:22px;right:18%;top:42%;}
  #treeBtn .eggspot:nth-child(5){width:26px;height:26px;left:40%;bottom:20%;}
  #treeBtn .eggspot:nth-child(6){width:17px;height:17px;right:30%;bottom:34%;}
  #treeBtn .eggspot:nth-child(7){width:15px;height:15px;left:14%;top:54%;}
  #treeBtn .eggspot:nth-child(8){width:18px;height:18px;right:12%;top:16%;}
  #eggHalo{position:absolute;inset:-84px;border-radius:50%;border:2px dashed rgba(255,205,110,.5);
    animation:spin 18s linear infinite;pointer-events:none;}
  #eggHalo2{position:absolute;inset:-50px;border-radius:50%;
    border:1px solid rgba(255,225,160,.5);border-top-color:transparent;border-bottom-color:transparent;
    animation:spin 10s linear infinite reverse;pointer-events:none;}
  .efx{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd97a;filter:blur(1px);
    animation:efxFloat 2.4s ease-in-out infinite;pointer-events:none;}
  .efx:nth-of-type(1){left:-34px;top:30%;animation-delay:0s;}
  .efx:nth-of-type(2){right:-26px;top:52%;animation-delay:.7s;}
  .efx:nth-of-type(3){left:-20px;bottom:18%;animation-delay:1.3s;}
  .efx:nth-of-type(4){right:-36px;bottom:30%;animation-delay:1.9s;}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes eggFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  @keyframes eggGlow{0%,100%{box-shadow:inset -18px -26px 44px rgba(80,10,0,.6), inset 10px 14px 30px rgba(255,235,200,.5), 0 0 26px rgba(255,150,60,.45);}
    50%{box-shadow:inset -18px -26px 44px rgba(80,10,0,.6), inset 10px 14px 30px rgba(255,235,200,.5), 0 0 64px rgba(255,170,70,.9);}}
  @keyframes sheen{0%{background-position:130% 0;}100%{background-position:-40% 0;}}
  @keyframes efxFloat{0%,100%{transform:translate(0,0);opacity:.9;}50%{transform:translate(0,-16px);opacity:.3;}}
  #eggHint{position:relative;color:#fff;font-weight:700;margin-top:16px;font-size:15px;
    text-shadow:0 2px 6px rgba(0,0,0,.7);background:rgba(10,25,50,.5);padding:5px 16px;border-radius:999px;
    border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(3px);}
  /* 孵化动画中的蛋 */
  #eggWrap{position:absolute;top:24%;display:none;flex-direction:column;align-items:center;z-index:3;}
  #egg{width:170px;height:215px;border-radius:50% 50% 46% 46%;position:relative;
    background:radial-gradient(circle at 34% 26%, #ffcf8a 0%, #ff8a3d 38%, #e0521f 70%, #a02a12 100%);
    box-shadow:0 0 46px 12px rgba(255,120,40,.6), inset -12px -18px 34px rgba(120,20,0,.55), inset 8px 10px 22px rgba(255,240,210,.5);
    animation:eggShake .45s infinite alternate ease-in-out;}
  #egg::before{content:"";position:absolute;left:24%;top:20%;width:26%;height:16%;border-radius:50%;
    background:rgba(255,255,255,.5);filter:blur(4px);}
  #eggCrack{display:none;width:200px;height:225px;border-radius:50% 50% 46% 46%;overflow:hidden;position:relative;
    background:radial-gradient(circle at 34% 28%, #ffe9c0, #ff9a4a 50%, #b03a12);
    box-shadow:0 0 60px 20px rgba(255,140,40,.85);align-items:center;justify-content:center;}
  @keyframes eggShake{from{transform:rotate(-6deg);}to{transform:rotate(6deg);}}
  @keyframes crackPop{0%{transform:scale(.9);}60%{transform:scale(1.18);}100%{transform:scale(1);}}

  #hatchInfo{color:#fff;font-weight:700;margin-top:10px;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.7);z-index:3;}
  /* 底部控制栏：第一个按钮 = 孵化 */
  #treeCtrl{margin:4px 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .btn{border:0;cursor:pointer;color:#fff;font-weight:700;font-size:14px;padding:10px 20px;border-radius:999px;
    background:linear-gradient(180deg,#ffb03a,#e9761c);box-shadow:0 5px 16px rgba(233,118,28,.5), inset 0 1px 0 rgba(255,255,255,.5);
    transition:.15s;user-select:none;}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.06);}
  .btn:active{transform:scale(.96);}
  .btn.blue{background:linear-gradient(180deg,#4fb4ff,#1f7fe0);box-shadow:0 5px 16px rgba(31,127,224,.45), inset 0 1px 0 rgba(255,255,255,.5);}
  .btn.green{background:linear-gradient(180deg,#59e08a,#24a85a);box-shadow:0 5px 16px rgba(36,168,90,.45), inset 0 1px 0 rgba(255,255,255,.5);}
  .btn:disabled{filter:grayscale(.7) brightness(.85);cursor:not-allowed;}

  .autoBox{display:flex;gap:5px;align-items:center;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 8px;backdrop-filter:blur(4px);}
  .speedbox{display:flex;gap:5px;align-items:center;}
  .chip{padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);transition:.15s;user-select:none;}
  .chip:hover{background:rgba(255,255,255,.24);}
  .chip.on{background:linear-gradient(180deg,#ffd94d,#ffa51e);color:#3a2600;border-color:#ffd94d;}
  .chip.auto-chip.on{background:linear-gradient(180deg,#59e08a,#24a85a);color:#fff;border-color:#59e08a;}

  /* 结果弹窗 */
  #resultModal{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;
    background:rgba(3,8,20,.6);backdrop-filter:blur(3px);}
  #resultModal.show{display:flex;}
  #resultCard{width:min(88%, 430px);border-radius:18px;padding:22px;text-align:center;color:#fff;
    background:rgba(12,26,52,.92);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(12px);
    box-shadow:0 18px 50px rgba(0,0,0,.6);animation:crackPop .35s;}
  #rcSprite{width:180px;height:180px;image-rendering:pixelated;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));}
  #rcName{font-size:28px;font-weight:800;margin:4px 0 2px;}
  #rcMeta{font-size:15px;opacity:.95;margin-bottom:14px;line-height:1.7;}
  #rcQuality{display:inline-block;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:800;margin-bottom:8px;}
  #rcBtns{display:flex;gap:12px;justify-content:center;}

  /* 属性页 */
  #slotGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;height:100%;overflow-y:auto;align-content:start;padding:2px;}
  .slot{position:relative;border-radius:14px;padding:8px 6px 7px;text-align:center;cursor:pointer;
    background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);backdrop-filter:blur(5px);
    transition:.15s;}
  .slot:hover{transform:translateY(-2px);}
  .slot .qbar{position:absolute;top:0;left:0;right:0;height:4px;border-radius:4px 4px 0 0;}
  .slot img{width:72px;height:72px;image-rendering:pixelated;}
  .slot .nm{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slot .tp{font-size:10px;color:rgba(255,255,255,.7);}
  .slot .lv{font-size:11px;color:#ffd94d;font-weight:700;}
  .slot .cp{font-size:12px;color:#7fe8ff;font-weight:700;}
  .slot.empty{opacity:.55;}
  .slot.empty img{opacity:0;}
  #slotEmpty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;
    font-size:17px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  /* 精灵详情弹窗 */
  #slotModal{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;
    background:rgba(3,8,20,.6);backdrop-filter:blur(3px);}
  #slotModal.show{display:flex;}
  #slotCard{width:min(90%, 460px);border-radius:18px;padding:20px;color:#fff;
    background:rgba(12,26,52,.92);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(12px);
    box-shadow:0 18px 50px rgba(0,0,0,.6);animation:crackPop .3s;text-align:center;}
  #slotCard .sdTop{display:flex;gap:18px;align-items:center;text-align:left;margin-bottom:12px;}
  #sdSprite{width:130px;height:130px;image-rendering:pixelated;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));}
  #sdName{font-size:26px;font-weight:800;line-height:1.2;}
  #sdQuality{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:800;margin:4px 0;}
  #sdMeta{font-size:13px;opacity:.92;line-height:1.8;}
  .sBar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px;}
  .sBar .lbl{width:44px;color:rgba(255,255,255,.85);text-align:right;flex-shrink:0;}
  .sBar .track{flex:1;height:10px;background:rgba(0,0,0,.4);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.15);}
  .sBar .fill{height:100%;border-radius:999px;}
  .sBar .val{width:34px;color:#ffd94d;font-weight:700;text-align:right;}
  #sdStats{background:rgba(0,0,0,.28);border-radius:12px;padding:8px 12px;border:1px solid rgba(255,255,255,.12);}
  #sdGo{display:flex;gap:10px;justify-content:center;margin:10px 0;font-size:13px;}
  #sdGo span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 12px;font-weight:700;}
  #sdClose{margin-top:4px;}

  /* ── 全屏战斗画面 ── */
  #fightOverlay{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;
    background:linear-gradient(180deg,rgba(3,6,16,.94),rgba(8,16,36,.97));padding:12px 16px 58px;color:#fff;}
  #fightOverlay.show{display:flex;}
  #foTop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  #foExit{cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:999px;
    padding:5px 14px;font-size:14px;font-weight:700;}
  #foExit:hover{background:rgba(255,255,255,.2);}
  #foFloor{font-size:17px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  #autoBattlePill{margin-left:auto;display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:13px;}
  .switch{width:52px;height:28px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;
    border:1px solid rgba(255,255,255,.35);transition:.2s;}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
    background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.4);}
  .switch.on{background:linear-gradient(90deg,#ffd94d,#ffa51e);}
  .switch.on::after{left:26px;}
  #bfArena{flex:1;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.38);
    border-radius:16px;padding:8px 20px;border:1px solid rgba(255,255,255,.16);position:relative;}
  .bfSide{display:flex;gap:12px;align-items:center;}
  .bfSide .spr{width:clamp(84px,26%,150px);aspect-ratio:1;object-fit:contain;image-rendering:pixelated;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.5));}
  .bfSide .spr.spr-empty{border-radius:50%;opacity:.85;}
  .bfSide .inf .nm{font-weight:800;font-size:18px;}
  .bfSide .inf .lv{font-size:13px;color:#ffd94d;}
  .vs{color:#ffd94d;font-weight:800;font-size:30px;text-shadow:0 0 14px rgba(255,200,80,.5);}
  .hpb{margin-top:4px;width:150px;height:12px;background:rgba(0,0,0,.45);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.25);}
  .hpf{height:100%;border-radius:999px;background:linear-gradient(90deg,#57e06a,#2bb55f);transition:width .3s;}
  /* 战斗解说屏 */
  #bfComment{flex:0 0 128px;display:flex;flex-direction:column;margin-top:8px;background:rgba(0,0,0,.42);
    border-radius:14px;border:1px solid rgba(255,255,255,.16);overflow:hidden;}
  #bfcHead{padding:6px 12px;font-weight:700;font-size:13px;background:rgba(255,217,77,.1);color:#ffd94d;
    border-bottom:1px solid rgba(255,255,255,.12);}
  #bfLog{flex:1;overflow-y:auto;padding:6px 12px;font-size:13px;line-height:1.7;}
  #bfLog div:last-child{animation:logIn .25s;}
  @keyframes logIn{from{opacity:0;transform:translateX(6px);}to{opacity:1;}}
  #bfSkip{position:absolute;right:16px;bottom:14px;z-index:11;}

  /* 对战选择页 */
  #battleWrap{height:100%;display:flex;flex-direction:column;}
  #battleSelect{flex:1;display:flex;flex-direction:column;}
  #battleSelect .tip{color:#fff;font-size:15px;margin-bottom:8px;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #bsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow-y:auto;}
  .bsCard{display:flex;gap:8px;align-items:center;border-radius:12px;padding:6px 8px;cursor:pointer;
    background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);color:#fff;transition:.15s;}
  .bsCard:hover{transform:translateY(-2px);background:rgba(255,255,255,.18);}
  .bsCard img{width:52px;height:52px;image-rendering:pixelated;}
  .bsCard .t{font-size:12px;color:rgba(255,255,255,.7);}

  /* 图鉴页 */
  #dexWrap{height:100%;display:flex;flex-direction:column;}
  #dexHead{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  #dexHead .tip{color:#fff;font-size:14px;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #dexGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-content:start;}
  .dexCell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);}
  .dexCell img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;}
  .dexCell.miss{background:rgba(0,0,0,.3);color:rgba(255,255,255,.3);font-size:18px;}

  /* 存档/重置 */
  #saveBar{position:absolute;left:12px;bottom:66px;z-index:5;display:flex;gap:8px;}
  .pill{cursor:pointer;color:#fff;font-size:12px;font-weight:700;background:rgba(0,0,0,.35);
    padding:4px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);transition:.15s;}
  .pill:hover{background:rgba(0,0,0,.55);}
  #linkTag{position:absolute;right:12px;bottom:66px;z-index:5;font-size:11px;color:rgba(255,255,255,.7);
    background:rgba(0,0,0,.35);padding:3px 9px;border-radius:999px;}

  /* 开局引导 */
  #tutorial{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 30%, rgba(8,16,40,.92), rgba(2,4,12,.97));}
  #tutorial.show{display:flex;}
  #tutCard{width:min(90%, 470px);border-radius:20px;padding:26px 26px 20px;color:#fff;text-align:center;
    background:rgba(16,32,66,.6);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);
    box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 0 60px rgba(90,140,255,.08);animation:crackPop .35s;}
  #tutIcon{font-size:58px;margin-bottom:8px;}
  #tutTitle{font-size:24px;font-weight:800;margin-bottom:10px;color:#ffd94d;}
  #tutBody{font-size:15px;line-height:1.8;min-height:96px;opacity:.95;}

/* ═════════════ 数值模型 ═════════════ */
function buildPokedex(){
  const map={};
  for(const row of window.PKDATA){
    const id=row[0],cn=row[1],types=row[2],s=row[3];
    const hp=s[0],atk=s[1],def=s[2],spa=s[3],spd=s[4],spe=s[5];
    const bst=hp+atk+def+spa+spd+spe;
    let quality=MYTHICAL.has(id)?"神话":LEGENDARY.has(id)?"传说":(bst<=299?"普通":bst<=450?"稀有":"史诗");
    const m=Q_BONUS[quality];
    const go_atk=2*Math.round(Math.sqrt(atk)*Math.sqrt(spa)+Math.sqrt(spe));
    const go_def=2*Math.round(Math.sqrt(def)*Math.sqrt(spd)+Math.sqrt(spe));
    const go_sta=2*hp;
    const mv=window.PKMOVES[id]||["撞击",60];
    map[id]={id,cn,types,hp,atk,def,spa,spd,spe,bst,quality,
      go_atk:Math.floor(go_atk*m),go_def:Math.floor(go_def*m),go_sta:Math.floor(go_sta*m),
      move:mv[0],move_power:mv[1]};
  }
  return map;
}
const pokedex=buildPokedex();
const cpm=l=>0.095*Math.sqrt(Math.max(1,l));
const calc_cp=(p,l)=>{const c=cpm(l);return Math.max(10,Math.floor((p.go_atk*Math.sqrt(p.go_def)*Math.sqrt(p.go_sta)*c*c)/10));};
const calc_hp=(p,l)=>Math.max(10,Math.floor(p.go_sta*Math.pow(1.5,l/10)));
function effMult(atkTypes,defTypes){
  let eff=1;
  for(const dt of defTypes)eff*=(TYPE_CHART[atkTypes[0]+"|"+dt]??1);
  return eff;
}
function calc_damage(aP,aLv,dP,dLv,critStreak){
  const a=aP.go_atk/15, mp=aP.move_power/8;
  const lvMult=Math.pow(1.5,(aLv-dLv)/10);
  const eff=effMult(aP.types,dP.types);
  const stab=1.5; // 本系招式加成
  const rng=0.85+Math.random()*0.15;
  let dmg=Math.max(1,Math.floor(a*mp*lvMult*eff*stab*rng));
  const dodged=Math.random()<DODGE_CHANCE[dP.quality];
  if(dodged)dmg=0;
  const isCrit=Math.random()<CRIT_CHANCE[aP.quality];
  if(!dodged&&isCrit){critStreak++;dmg=Math.floor(dmg*Math.pow(CRIT_MULT[aP.quality],critStreak));}
  else if(!isCrit){critStreak=0;}
  return {dmg,isCrit,critStreak,dodged,eff};
}

/* ═════════════ 游戏状态（进度保存在本机浏览器，换设备即全新账号） ═════════════ */
const st={level:1,xp:0,balls:10,masterBalls:0,maxTower:0,slots:{},seen:new Set(),
  autoThrow:false,autoSpeed:0,energy:0,energyMax:100,energyRate:50,
  screen:"tree",revealTimer:0,pending:null,firstSeen:0,
  autoBattle:false,btSlot:null,btPhase:"select",btPlayer:null,btEnemy:null,
  btP:0,btPmax:0,btE:0,btEmax:0,btTurn:0,btPTurn:true,btPcrit:0,btEcrit:0,
  btFloor:1,btElite:false,btResult:0,btTimer:0,btLog:[]};
const xpNeeded=()=>st.level<=XP_TABLE.length?XP_TABLE[st.level-1]:XP_TABLE[XP_TABLE.length-1];
const regenRate=()=>Math.max(1,Math.floor(st.maxTower/10));
function addXP(n){
  if(st.level>=100)return;
  st.xp+=n;
  while(st.xp>=xpNeeded()){
    st.xp-=xpNeeded();st.level++;
    if(st.level>=100){st.xp=0;break;}
    toast(`🎉 升级到 Lv.${st.level}！`);
  }
}
const qualityUnlocked=()=>st.level>=80?"神话":st.level>=50?"传说":st.level>=25?"史诗":st.level>=10?"稀有":"普通";
const qualityPool=()=>QUALITY_NAMES.slice(0,QUALITY_NAMES.indexOf(qualityUnlocked())+1);
const releaseXP=q=>Math.max(1,st.maxTower)*Math.max(1,st.level)*XP_MULT[q];
function checkFirstSeen(id,q){
  if(st.seen.has(id))return 0;
  st.seen.add(id);
  const mins={"普通":10,"稀有":20,"史诗":30,"传说":45,"神话":60}[q]||10;
  return regenRate()*mins;
}
function rollPokemon(master){
  let pool=qualityPool();
  let q;
  if(master){
    q=pool[pool.length-1];
  }else{
    const weights={"普通":50,"稀有":25,"史诗":15,"传说":7,"神话":3};
    let total=0;const v={};
    for(const qq of pool){v[qq]=weights[qq];total+=weights[qq];}
    let r=Math.random()*total,acc=0;q=pool[0];
    for(const qq of pool){acc+=v[qq];if(r<=acc){q=qq;break;}}
  }
  let cand=Object.values(pokedex).filter(p=>p.quality===q&&pool.includes(p.quality));
  if(!cand.length)cand=Object.values(pokedex).filter(p=>pool.includes(p.quality));
  const p=cand[Math.floor(Math.random()*cand.length)];
  let level;
  if(st.level<100){
    level=Math.max(1,Math.min(100,Math.floor(st.level*(0.9+Math.random()*0.2))));
  }else{
    const lvs=Object.values(st.slots).map(s=>s[1]);
    const minLv=lvs.length?Math.min(...lvs):0;
    if(Object.keys(st.slots).length===18&&minLv>=100){
      const maxLv=lvs.length?Math.max(...lvs):minLv;
      level=minLv+Math.floor(Math.random()*(maxLv-minLv+2));
    }else{
      level=Math.min(100,90+Math.floor(Math.random()*11));
    }
  }
  return [p,level,calc_cp(p,level)];
}
function tryReplace(pid,level,cp){
  const p=pokedex[pid];
  for(const t of p.types){
    if(st.slots[t]&&st.slots[t][0]===pid){
      const old=st.slots[t];
      if(cp>old[2])return{pending:true,slot:t};
      return{pending:false,slot:t,low:true};
    }
  }
  for(const t of p.types){
    if(!st.slots[t])return{pending:false,slot:t,empty:true};
  }
  let best=null;
  for(const t of p.types){
    const old=st.slots[t];const oldQ=QUALITY_NAMES.indexOf(pokedex[old[0]].quality);
    const newQ=QUALITY_NAMES.indexOf(p.quality);
    if(newQ>oldQ||(newQ===oldQ&&cp>old[2])){
      if(!best||newQ>best.newQ||(newQ===best.newQ&&cp>best.cp))best={slot:t,newQ,cp};
    }
  }
  if(best)return{pending:true,slot:best.slot};
  return{pending:false,slot:p.types[0],low:true};
}

const SAVE_KEY="jingling-web-save-v1";
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      level:st.level,xp:st.xp,balls:st.balls,masterBalls:st.masterBalls,maxTower:st.maxTower,
      slots:st.slots,seen:[...st.seen],autoThrow:st.autoThrow,autoSpeed:st.autoSpeed
    }));
  }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const d=JSON.parse(raw);
    st.level=d.level||1;st.xp=d.xp||0;st.balls=d.balls??10;st.masterBalls=d.masterBalls||0;
    st.maxTower=d.maxTower||0;st.slots=d.slots||{};st.seen=new Set(d.seen||[]);
    st.autoThrow=!!d.autoThrow;st.autoSpeed=d.autoSpeed||0;

}

function manualThrow(){
  if(st.balls<=0){toast("精灵球不足！");return;}
  if(st.revealTimer>0)return;
  st.balls--;st.revealTimer=2.6;
  const [p,lv,cp]=rollPokemon(false);
  startHatch(p,lv,cp,false);
}
function masterThrow(){
  if(st.masterBalls<=0){toast("大师球不足！通关每10层塔可获得");return;}
  if(st.revealTimer>0)return;
  st.masterBalls--;st.revealTimer=2.6;
  const [p,lv,cp]=rollPokemon(true);
  startHatch(p,lv,cp,true);
}
function startHatch(p,lv,cp,master){
  st.pending={p,lv,cp,master};
  hatchAnimStart=0;  // 重置动画起点，避免第二次孵化动画时长错乱
  const ew=$("eggWrap"),egg=$("egg"),crack=$("eggCrack"),info=$("hatchInfo");
  $("treeBtn").style.display="none";
  $("eggHint").style.display="none";
  ew.style.display="flex";egg.style.display="block";crack.style.display="none";
  egg.style.animation="eggShake .45s infinite alternate ease-in-out";
  info.textContent="孵化中…";
  st.firstSeen=checkFirstSeen(p.id,p.quality);
  if(st.firstSeen>0)st.balls=Math.min(15000000,st.balls+st.firstSeen);
  st.revealTimer=2.6;
}
let hatchAnimStart=0;
function tickHatch(now){
  if(st.revealTimer<=0||!st.pending)return;
  if(!hatchAnimStart)hatchAnimStart=now;
  const t=(now-hatchAnimStart)/1000;
  const p=st.pending;
  if(t>=1.8&&$("egg")&&$("egg").style.display!=="none"){
    $("egg").style.display="none";
    const crack=$("eggCrack");
    crack.style.display="flex";crack.style.animation="crackPop .5s";
    crack.innerHTML=`<div style="filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))">${spriteHTML(p.p.id,210)}</div>`;
    $("hatchInfo").innerHTML=`<span style="color:${QUALITY_COLORS[p.p.quality]}">${p.p.quality}</span> · Lv.${p.lv} · 战力 ${p.cp.toLocaleString()}`;
    burst(p.p.id,p.p.quality,120);
  }
  if(t>=2.6){
    st.revealTimer=0;hatchAnimStart=0;
    showResult();
  }
}

/* 结果弹窗 */
function showResult(){
  const r=st.pending;if(!r)return;
  const p=r.p,pid=p.id;
  $("rcSprite").src=window.PKSPRITES[pid]||"";
  const ql=$("rcQuality");ql.textContent=p.quality;ql.style.background=QUALITY_COLORS[p.quality];
  ql.style.color="#fff";ql.style.textShadow="0 1px 3px rgba(0,0,0,.4)";
  $("rcName").textContent=`${p.cn}`;
  let meta=`Lv.${r.lv} · 战力 ${r.cp.toLocaleString()}<br>招式：${p.move}（威力${p.move_power}） · ${p.types.map(t=>TYPE_CN[t]).join("/")} 系`;
  if(st.firstSeen>0)meta+=`<br><span style="color:#7fffb0">✨ 首次发现！奖励 ${st.firstSeen} 球</span>`;
  $("rcMeta").innerHTML=meta;
  $("rcYes").textContent=r.master?"🌟 大师球收服":"收服 / 替换";
  const rep=tryReplace(pid,r.lv,r.cp);
  if(rep.pending){
    $("rcYes").style.display="";$("rcNo").style.display="";
  }else if(rep.low){
    $("rcYes").style.display="none";$("rcNo").textContent="放生获得经验";$("rcNo").style.display="";
  }else{
    $("rcYes").style.display="";$("rcNo").style.display="none";
  }
  $("resultModal").classList.add("show");
  renderHUD();
}
$("rcYes").onclick=()=>{
  const r=st.pending;if(!r)return;
  const rep=tryReplace(r.p.id,r.lv,r.cp);
  if(rep.pending||rep.empty){
    st.slots[rep.slot]=[r.p.id,r.lv,r.cp];
    toast(`${r.p.cn} 已进入 ${TYPE_CN[rep.slot]} 属性槽！`);
  }else{
    addXP(releaseXP(r.p.quality));
    toast(`${r.p.cn} 放生了，获得经验`);
  }
  st.pending=null;$("resultModal").classList.remove("show");
  $("treeBtn").style.display="";
  $("eggHint").style.display="";
  renderTree();renderHUD();saveGame();
};
$("rcNo").onclick=()=>{
  const r=st.pending;if(!r)return;

  toast(`${r.p.cn} 放生了，获得经验`);

/* 开始一场战斗（进入全屏战斗画面） */
function startBattle(slot){
  const s=st.slots[slot];if(!s){toast("该槽位没有精灵");return;}
  const pid=s[0],lv=s[1];
  const floor=st.maxTower+1;
  const eLv=Math.floor((floor-1)/10)+1;
  const elite=((floor-1)%10===9);
  let eq=floor<=200?(elite?"稀有":"普通"):floor<=400?(elite?"史诗":"稀有"):floor<=600?(elite?"传说":"史诗"):(elite?"神话":"传说");
  let cand=Object.values(pokedex).filter(p=>p.quality===eq);
  if(!cand.length)cand=Object.values(pokedex);
  const enemy=cand[Math.floor(Math.random()*cand.length)];
  st.btSlot=slot;st.btPlayer=[pid,lv];st.btEnemy=[enemy.id,eLv,enemy.quality];
  st.btPmax=calc_hp(pokedex[pid],lv);st.btP=st.btPmax;
  st.btEmax=Math.floor(calc_hp(enemy,eLv)*(1+(elite?0.3:0)));st.btE=st.btEmax;
  st.btPTurn=(pokedex[pid].spe*lv>=enemy.spe*eLv);
  st.btTurn=0;st.btPcrit=0;st.btEcrit=0;st.btFloor=floor;st.btElite=elite;
  st.btLog=[`⚔️ ${pokedex[pid].cn} VS ${enemy.cn}！`, `${st.btPTurn?pokedex[pid].cn:enemy.cn} 先手！`];
  st.btPhase="fight";st.btTimer=0;st.btResult=0;
  showFight();
  buildFightUI();
  if(st.autoBattle)resolveFight();
}
/* 渲染战斗画面（每次战斗重建，保证精灵形象实时刷新） */
function buildFightUI(){
  const p=pokedex[st.btPlayer[0]],e=pokedex[st.btEnemy[0]];
  $("foFloor").innerHTML=`🏯 第 ${st.btFloor} 层 ${st.btElite?"👑 精英怪":""}`;
  $("abSwitch").classList.toggle("on",st.autoBattle);
  const spr=id=>{const src=window.PKSPRITES[id];
    return src?`<img class="spr" src="${src}" alt="">`
              :`<div class="spr spr-empty" style="background:${QUALITY_COLORS[pokedex[id].quality]}"></div>`;};
  $("bfArena").innerHTML=`
    <div class="bfSide"><div class="spr">${spr(p.id)}</div>
      <div class="inf"><div class="nm">${p.cn} <span style="color:${QUALITY_COLORS[p.quality]}">${p.quality}</span></div>
      <div class="lv">Lv.${st.btPlayer[1]}</div>
      <div class="hpb"><div class="hpf" id="pf" style="width:100%"></div></div></div></div>
    <div class="vs">VS</div>
    <div class="bfSide" style="flex-direction:row-reverse"><div class="spr">${spr(e.id)}</div>
      <div class="inf" style="text-align:right"><div class="nm">${e.cn} <span style="color:${QUALITY_COLORS[e.quality]}">${e.quality}</span></div>
      <div class="lv">Lv.${st.btEnemy[1]}</div>
      <div class="hpb" style="margin-left:auto"><div class="hpf" id="ef" style="width:100%"></div></div></div></div>`;
  $("bfLog").innerHTML=st.btLog.map(x=>`<div>${x}</div>`).join("");
  $("bfLog").scrollTop=$("bfLog").scrollHeight;
}
function pushLog(line){st.btLog.push(line);if(st.btLog.length>80)st.btLog.shift();
  const box=$("bfLog");if(box){box.innerHTML=st.btLog.map(x=>`<div>${x}</div>`).join("");box.scrollTop=box.scrollHeight;}}
function resolveFight(){
  const p=pokedex[st.btPlayer[0]],e=pokedex[st.btEnemy[0]];
  const plv=st.btPlayer[1],elv=st.btEnemy[1];
  let guard=0;
  while(st.btP>0&&st.btE>0&&guard++<5000){
    if(st.btPTurn){
      const r=calc_damage(p,plv,e,elv,st.btPcrit);st.btE-=r.dmg;st.btPcrit=r.critStreak;
      if(r.dmg>0&&!r.dodged)burst(null,null,8);
      st.btEcrit=0;
    }else{
      const r=calc_damage(e,elv,p,plv,st.btEcrit);st.btP-=r.dmg;st.btEcrit=r.critStreak;
      st.btPcrit=0;
    }
    st.btPTurn=!st.btPTurn;st.btTurn++;
  }
  st.btP=Math.max(0,st.btP);st.btE=Math.max(0,st.btE);
  st.btPhase="result";
  if(st.btE<=0){st.maxTower++;st.btFloor=st.maxTower;
    st.balls=Math.min(15000000,st.balls+st.btFloor);
    if(st.btElite)st.masterBalls++;
    pushLog(`🎉 胜利！获得 ${st.btFloor} 球${st.btElite?" + 大师球":""}`);
    saveGame();
  }else{
    pushLog(`💀 战败…`);
  }
  if(st.autoBattle){
    st.btResult=1.5;
  }else{
    st.btResult=2.2;
  }
  renderHUD();
}
function tickBattle(dt){
  if(st.btPhase!=="fight"&&st.btPhase!=="result")return;
  if(st.btPhase==="result"){
    st.btResult-=dt;
    if(st.btResult<=0){
      st.btResult=0;
      if(st.autoBattle){st.btPhase="select";startBattle(st.btSlot);}  // 自动连战：重开并刷新精灵形象
      else{st.btPhase="select";hideFight();renderBattle();}
    }
    return;
  }
  // 手动战斗回合推进
  if(st.btPhase==="fight"&&!st.autoBattle){
    st.btTimer-=dt;
    if(st.btTimer<=0){
      st.btTimer=0.7;st.btTurn++;
      const p=pokedex[st.btPlayer[0]],e=pokedex[st.btEnemy[0]];
      const plv=st.btPlayer[1],elv=st.btEnemy[1];
      let line="";
      if(st.btPTurn){
        const r=calc_damage(p,plv,e,elv,st.btPcrit);st.btE-=r.dmg;
        st.btPcrit=r.isCrit?r.critStreak:0;st.btEcrit=0;
        if(r.dodged)line=`💨 ${e.cn} 闪避了 ${p.cn} 的攻击！`;
        else line=`⚡ ${p.cn} 使用${p.move}，造成 ${r.dmg} 伤害${r.isCrit?"💥暴击!":""}${r.eff>=2?" 效果拔群!":r.eff<=0.5?" 收效甚微...":""}`;
      }else{
        const r=calc_damage(e,elv,p,plv,st.btEcrit);st.btP-=r.dmg;
        st.btEcrit=r.isCrit?r.critStreak:0;st.btPcrit=0;
        if(r.dodged)line=`💨 ${p.cn} 闪避了 ${e.cn} 的攻击！`;
        else line=`🔥 ${e.cn} 使用${e.move}，造成 ${r.dmg} 伤害${r.isCrit?"💥暴击!":""}${r.eff>=2?" 效果拔群!":r.eff<=0.5?" 收效甚微...":""}`;
      }
      st.btPTurn=!st.btPTurn;
      pushLog(line);
      if(st.btP<=0){st.btP=0;pushLog(`💀 ${p.cn} 倒下了...`);st.btPhase="result";st.btResult=2.2;renderHUD();}
      if(st.btE<=0){st.btE=0;pushLog(`🎉 ${e.cn} 倒下了！`);st.btPhase="result";
        st.btResult=2.2;st.maxTower++;st.btFloor=st.maxTower;
        st.balls=Math.min(15000000,st.balls+st.btFloor);
        if(st.btElite)st.masterBalls++;
        pushLog(`获得 ${st.btFloor} 球${st.btElite?" + 大师球":""}`);
        saveGame();renderHUD();}
      updateBars();
    }
  }
  updateBars();
}
function updateBars(){
  const pf=$("pf"),ef=$("ef");
  if(pf)pf.style.width=Math.max(0,st.btP/st.btPmax*100)+"%";
  if(ef)ef.style.width=Math.max(0,st.btE/st.btEmax*100)+"%";
}

/* ═════════════ 粒子系统（星空 + 流星 + 庆祝火花 + 星光） ═════════════ */
const canvas=$("spark"),ctx=canvas.getContext("2d");
let sparks=[];
let stars=[],meteors=[];
function initStars(){
  stars.length=0;
  for(let i=0;i<170;i++)stars.push({x:Math.random(),y:Math.random(),
    r:0.5+Math.random()*1.3,ph:Math.random()*6.28,sp:0.4+Math.random()*1.8,big:Math.random()<0.1});
}
function sizeCanvas(){const r=$("stage").getBoundingClientRect();canvas.width=r.width;canvas.height=r.height;initStars();}
sizeCanvas();addEventListener("resize",sizeCanvas);
function burst(pid,q,count){
  const cx=canvas.width/2,cy=canvas.height/2;
  const col=(pid?QUALITY_RGB[pokedex[pid].quality]:(q?QUALITY_RGB[q]:null))||[255,200,120];
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=80+Math.random()*260;
    sparks.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.7+Math.random()*1.6,
      color:`rgb(${Math.min(255,col[0]+(Math.random()*80-40)|0)},${Math.min(255,col[1]+(Math.random()*80-40)|0)},${Math.min(255,col[2]+(Math.random()*80-40)|0)})`,g:150});
  }
}
function tickSparks(dt){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const t=performance.now()/1000;
  // 背景星海（闪烁）
  for(const s of stars){
    const a=0.25+0.55*Math.abs(Math.sin(t*s.sp+s.ph));
    ctx.globalAlpha=a;
    ctx.fillStyle=s.big?"#cfe4ff":"#fff";
    ctx.beginPath();ctx.arc(s.x*canvas.width,s.y*canvas.height,s.r,0,Math.PI*2);ctx.fill();
  }
  // 流星
  if(Math.random()<dt*0.10)meteors.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height*0.35,
    vx:-(170+Math.random()*150),vy:55+Math.random()*60,life:0.7});
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];m.life-=dt;
    if(m.life<=0){meteors.splice(i,1);continue;}
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    ctx.strokeStyle=`rgba(255,255,255,${Math.max(0,m.life)*0.9})`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*0.05,m.y-m.vy*0.05);ctx.stroke();
  }
  // 庆祝火花
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.life-=dt;
    if(s.life<=0){sparks.splice(i,1);continue;}
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=s.g*dt;s.vx*=0.97;
    ctx.globalAlpha=Math.max(0,Math.min(1,s.life));
    ctx.fillStyle=s.color;
    ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill();
  }
  // 漂浮光点
  ctx.globalAlpha=1;
  for(let i=0;i<12;i++){
    const x=(Math.sin(t*0.4+i*7.1)*0.5+0.5)*canvas.width;
    const y=((t*12+i*130)%(canvas.height+40))-20;
    ctx.globalAlpha=0.3+0.4*Math.sin(t*2+i);
    ctx.fillStyle=i%2?"#ffe9a8":"#9fd0ff";
    ctx.beginPath();ctx.arc(x,y,1.6,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ═════════════ 主循环 ═════════════ */
let lastT=performance.now(),saveTimer=0;
function loop(now){
  const dt=Math.min(0.1,(now-lastT)/1000);lastT=now;
  // 自动孵化（能量满 + 有球 + 不在手动孵化动画中才执行）
  st.energy+=st.energyRate*dt;
  if(st.energy>=st.energyMax&&st.balls>0&&st.revealTimer<=0){
    st.energy=0;
    const sp=SPEEDS[st.autoSpeed];
    const n=Math.min(sp,st.balls);
    if(n>0){st.balls-=n;
      for(let i=0;i<n;i++)autoHatchOne();
    }
    renderHUD();
  }
  // 无球自动关闭自动孵化
  if(st.autoThrow&&st.balls<=0){st.autoThrow=false;if(st.revealTimer<=0)renderTree();toast("精灵球不足，自动孵化已暂停");}
  tickHatch(now);
  tickBattle(dt);
  tickSparks(dt);
  // 自动存档
  saveTimer+=dt;
  if(saveTimer>=5){saveTimer=0;saveGame();}
  requestAnimationFrame(loop);
}
function autoHatchOne(){
  const [p,lv,cp]=rollPokemon(false);
  st.firstSeen=checkFirstSeen(p.id,p.quality);
  if(st.firstSeen>0)st.balls=Math.min(15000000,st.balls+st.firstSeen);
  const rep=tryReplace(p.id,lv,cp);
  if(rep.pending||rep.empty){
    if(rep.pending){
      const old=st.slots[rep.slot];
      if(cp>old[2])st.slots[rep.slot]=[p.id,lv,cp];
      else addXP(releaseXP(p.quality));
    }else st.slots[rep.slot]=[p.id,lv,cp];
  }else{
    addXP(releaseXP(p.quality));
  }
}

/* ── 开局引导 ── */
const TUT=[
  {ico:"🥚",t:"点击精灵蛋孵化",b:"点一下中央的凤王精灵蛋，消耗 1 颗精灵球随机孵化一只宝可梦。品质从普通 → 稀有 → 史诗 → 传说 → 神话，越高越稀有。"},
  {ico:"⚡",t:"自动孵化 & 大师球",b:"开启「自动孵化」能量满就会自动孵化，可调 1x~10x 速度。通关爬塔每 10 层获得 1 颗大师球，必出当前最高品质，右上角一键投掷。"},
  {ico:"⚔️",t:"爬塔对战 & 图鉴",b:"在「对战」页选中精灵后自动进入全屏战斗画面，开启自动连战可挂机推塔，每 10 层有精英怪。收集 649 只图鉴，解锁首次发现奖励。"},
  {ico:"💾",t:"进度自动保存",b:"进度自动保存在本机浏览器，刷新后继续。换一台设备或浏览器就是全新账号。"}
];
let tutIdx=0;
function showTutorial(i){
  tutIdx=i;
  const s=TUT[i];
  $("tutIcon").textContent=s.ico;
  $("tutTitle").textContent=s.t;
  $("tutBody").textContent=s.b;
  $("tutPrev").style.display=i===0?"none":"";
  $("tutNext").style.display=i===TUT.length-1?"none":"";
  $("tutStart").style.display=i===TUT.length-1?"":"none";
  $("tutDots").innerHTML=TUT.map((_,k)=>`<div class="tdot ${k===i?"on":""}"></div>`).join("");
  $("tutorial").classList.add("show");
}
function hideTutorial(){$("tutorial").classList.remove("show");}

/* ── 切换页面 ── */
function switchTab(tab){
  st.screen=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===tab));
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $("screen-"+tab).classList.add("on");
  if(tab==="tree")renderTree();
  if(tab==="slots")renderSlots();
  if(tab==="battle"){renderBattle();if(st.btPhase!=="select")showFight();}
  if(tab==="dex")renderDex();
  if(tab!=="battle")hideFight();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));

/* ── 启动 ── */
const hasSave=loadGame();
renderTree();renderHUD();
$("hudBallIcon").src=BALL;
$("hudMasterIcon").src=MASTER;
// 大师球（右上角 HUD）点击投掷
$("hudMaster").onclick=masterThrow;
// 结果弹窗关闭不打断
$("resultModal").addEventListener("click",e=>{if(e.target.id==="resultModal"){st.pending=null;$("resultModal").classList.remove("show");$("treeBtn").style.display="";$("eggHint").style.display="";renderTree();}});
// 属性详情弹窗关闭
$("slotModal").addEventListener("click",e=>{if(e.target.id==="slotModal")$("slotModal").classList.remove("show");});
$("sdClose").onclick=()=>$("slotModal").classList.remove("show");
// 战斗画面
$("foExit").onclick=()=>{st.autoBattle=false;st.btPhase="select";hideFight();renderBattle();};
$("abSwitch").onclick=()=>{st.autoBattle=!st.autoBattle;buildFightUI();if(st.autoBattle&&st.btPhase==="fight")resolveFight();};
$("bfSkip").onclick=resolveFight;
// 存档 / 重置
$("btnSave").onclick=()=>{saveGame();toast("💾 进度已保存到本机浏览器");};
$("btnReset").onclick=()=>{if(confirm("确定重置存档吗？将清空本机进度重新开始。")){localStorage.removeItem(SAVE_KEY);location.reload();}};
// 开局引导
$("tutPrev").onclick=()=>showTutorial(Math.max(0,tutIdx-1));
$("tutNext").onclick=()=>showTutorial(Math.min(TUT.length-1,tutIdx+1));
$("tutStart").onclick=()=>{hideTutorial();toast("🎉 出发！点击精灵蛋开始收集！");};
$("tutReset").onclick=()=>{if(confirm("确定重置存档吗？")){localStorage.removeItem(SAVE_KEY);location.reload();}};
if(hasSave){toast("🎉 欢迎回来，继续你的冒险！");}
else{showTutorial(0);}
requestAnimationFrame(loop);
</script>
